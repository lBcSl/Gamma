<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Gamma - HUB</title>
<script src="../core/tema.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="hub.css" />
</head>
<body>
  <div class="shell">

    <header class="topbar">
      <div class="brand">
        <div class="logo"><img class="logo-img" src="../icons/icon128.png" alt="" /></div>
        <span class="brand-name" id="brandName">Gamma</span>
      </div>

      <!-- abas do módulo aberto (vêm do template dele) -->
      <nav class="tabs" data-slot="abas-topo"></nav>

      <span class="today" id="todayLabel"></span>
    </header>

    <div class="body">

      <!-- NAV LATERAL: um item por módulo registrado (core/modulos.js) + os que ainda virão -->
      <aside class="sidenav">
        <nav class="sidenav-group" id="navModulos" aria-label="Módulos">
          <button class="nav-item disabled" title="Atalhos (em breve)" aria-label="Atalhos (em breve)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
          </button>
          <button class="nav-item disabled" title="Scripts / Mensagens (em breve)" aria-label="Scripts / Mensagens (em breve)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
          </button>
        </nav>
        <nav class="sidenav-group" aria-label="Preferências">
          <button class="nav-item btn-tema" data-alternar-tema title="Usar tema escuro" aria-label="Usar tema escuro">
            <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </nav>
      </aside>

      <!-- tela do módulo aberto -->
      <main class="content" id="conteudo"></main>
    </div>
  </div>

  <script type="module" src="hub.js"></script>
</body>
</html>
