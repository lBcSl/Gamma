<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Gamma</title>
<script src="../core/tema.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><img class="logo-img" src="../icons/icon128.png" alt="" /></div>
      <span class="brand-name">Gamma - Backlog</span>
    </div>
    <div class="topbar-right">
      <span class="today" id="todayLabel"></span>
      <button class="btn-tema" data-alternar-tema title="Usar tema escuro" aria-label="Usar tema escuro">
        <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="tabs-row">
    <!-- abas do módulo (vêm do template dele) -->
    <nav class="tabs" data-slot="abas"></nav>
    <button class="tab-btn tab-config" data-tab="config" title="Configurações" aria-label="Configurações">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <main class="content">

    <!-- ABA: CONFIG -->
    <section class="tab-panel" id="tab-config">
      <div class="card">
        <div class="card-title">
          <span class="icon-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></span>
          <div>
            <h2>Backup local</h2>
            <p class="hint">Pra não perder os dados trocando de máquina.</p>
          </div>
        </div>
        <button id="btnExportar" class="btn-primary">Exportar backup (.json)</button>
        <label class="drop">
          <span class="icon-circle dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5M7 10l5-5 5 5M5 20h14"/></svg></span>
          <strong>Importar backup</strong>
          <span class="hint">Clique para escolher o arquivo .json</span>
          <input type="file" id="inputImportar" accept="application/json" />
        </label>
      </div>
      <p class="feedback" id="feedbackConfig"></p>
    </section>

  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
